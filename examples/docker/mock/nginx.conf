# Mock users / posts REST services (t/lib/mock.lua) for the example.
worker_processes 1;
error_log stderr warn;
events {}
http {
    access_log off;
    lua_shared_dict mock 1m;
    server {
        listen 8080;
        location / {
            content_by_lua_block { require("mock").handle() }
        }
    }
}
