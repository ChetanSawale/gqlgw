# An existing nginx configuration that serves gqlgw from its own server {}.
events {}

http {
    include /etc/nginx/gqlgw/gqlgw.http.conf;      # shm, init_by_lua, upstreams, admin server

    server {
        listen 443 ssl;
        server_name www.example.com;
        ssl_certificate     /etc/ssl/example.com.pem;
        ssl_certificate_key /etc/ssl/example.com.key;

        location / {
            root /srv/www;                         # the rest of the site
        }

        include /etc/nginx/gqlgw/gqlgw.locations.conf;   # /api/graphql + /_src/<source>/
    }
}
