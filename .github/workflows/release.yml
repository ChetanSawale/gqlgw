# Release: push a tag vX.Y.Z (equal to _VERSION of lua/gqlgw/init.lua, with a
# "## [X.Y.Z]" section in CHANGELOG.md). The image is tested, built for amd64
# and arm64, pushed to ghcr.io/abusi/gqlgw with a build provenance
# attestation, then the GitHub release is created from the changelog.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: version, changelog, make docker-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: The tag matches _VERSION and the changelog
        run: |
          version=$(sed -n 's/^local _M = { _VERSION = "\(.*\)" }/\1/p' lua/gqlgw/init.lua)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match _VERSION $version (lua/gqlgw/init.lua)"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## [$version]\" section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Image + example gateways + memcached + mock backend
        run: make docker-test

  image:
    name: ghcr.io image (amd64, arm64)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub release
    needs: [check, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Image

          \`\`\`bash
          docker pull $IMAGE:$VERSION        # linux/amd64, linux/arm64
          gh attestation verify oci://$IMAGE:$VERSION -R $GITHUB_REPOSITORY
          \`\`\`

          Documentation: https://abusi.github.io/gqlgw/
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "gqlgw $VERSION" --notes-file notes.md
