# gqlgw image: main nginx configuration.
#
# The gateway itself comes from /tmp/gqlgw/gqlgw.conf, rendered at start by
# `gqlc render` from /etc/gqlgw/gqlgw.toml. Additions:
#   /etc/gqlgw/conf.d/*.conf               http {} level
#   /etc/gqlgw/server.d/*.conf             inside the gqlgw server {}
#   /etc/gqlgw/sources.d/<source>/*.conf   inside the location of one source
# Everything written at run time lives in /tmp/gqlgw: the image works with
# docker run --read-only --tmpfs /tmp.
worker_processes auto;
worker_rlimit_nofile 16384;
error_log stderr warn;
pid /tmp/gqlgw/nginx.pid;
pcre_jit on;

events {
    worker_connections 4096;
}

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    access_log /dev/stdout;

    client_body_temp_path /tmp/gqlgw/tmp/client_body;
    proxy_temp_path /tmp/gqlgw/tmp/proxy;
    fastcgi_temp_path /tmp/gqlgw/tmp/fastcgi;
    uwsgi_temp_path /tmp/gqlgw/tmp/uwsgi;
    scgi_temp_path /tmp/gqlgw/tmp/scgi;

    include /tmp/gqlgw/gqlgw.conf;
    include /etc/gqlgw/conf.d/*.conf;
}
